# NEXORA web: main nginx configuration for a NON-ROOT, read-only-root-filesystem container.
# Everything nginx writes at runtime lives under /tmp (writable tmpfs / emptyDir); logs go to the
# container's stdout/stderr. The server block is rendered from default.conf.template into
# /etc/nginx/conf.d by docker-entrypoint.sh.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
