apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexora.fullname" . }}-web
  labels:
    {{- include "nexora.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "nexora.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexora.labels" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "nexora.fullname" . }}
      automountServiceAccountToken: false
      {{- include "nexora.pullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.web.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: {{ include "nexora.image" (list . "web") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NEXORA_API_UPSTREAM
              value: {{ printf "http://%s-control-plane:8000" (include "nexora.fullname" .) | quote }}
          securityContext:
            {{- toYaml .Values.web.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: nginx-conf
          emptyDir:
            sizeLimit: 1Mi
