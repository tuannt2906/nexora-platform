{{- if .Values.secrets.externalSecret.enabled }}
# Secret VALUES live in the external secret manager; this only maps remote keys to the Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.secretName }}
  labels:
    {{- include "nexora.labels" (dict "root" . "component" "nexora") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secrets.externalSecret.secretStoreRef.kind }}
    name: {{ .Values.secrets.externalSecret.secretStoreRef.name }}
  target:
    name: {{ .Values.secrets.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: NEXORA_DATABASE_URL
      remoteRef:
        key: {{ .Values.secrets.externalSecret.remoteKeys.databaseUrl }}
    - secretKey: NEXORA_API_TOKEN
      remoteRef:
        key: {{ .Values.secrets.externalSecret.remoteKeys.apiToken }}
{{- end }}
