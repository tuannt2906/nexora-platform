apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexora.fullname" . }}-control-plane
  labels:
    {{- include "nexora.labels" (dict "root" . "component" "control-plane") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "nexora.selectorLabels" (dict "root" . "component" "control-plane") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexora.fullname" . }}-web
  labels:
    {{- include "nexora.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "nexora.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
