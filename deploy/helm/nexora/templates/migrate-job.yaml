{{- if .Values.migration.enabled }}
# Runs BEFORE the new Deployments roll (Helm pre-install/pre-upgrade hook). The secret named by
# secrets.secretName must already exist: on a first install create it (ExternalSecret) first.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nexora.fullname" . }}-migrate
  labels:
    {{- include "nexora.labels" (dict "root" . "component" "migrate") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "nexora.labels" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "nexora.fullname" . }}
      automountServiceAccountToken: false
      {{- include "nexora.pullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.controlPlane.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "nexora.image" (list . "control-plane") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "nexora_control_plane.migrate"]
          envFrom:
            - configMapRef:
                name: {{ include "nexora.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secrets.secretName }}
          securityContext:
            {{- toYaml .Values.controlPlane.securityContext | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
