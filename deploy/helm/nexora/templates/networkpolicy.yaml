{{- if .Values.networkPolicy.enabled }}
# Default deny, then explicit allows (mirrors deploy/kubernetes/base/networkpolicy.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nexora.fullname" . }}-default-deny
  labels:
    {{- include "nexora.labels" (dict "root" . "component" "nexora") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nexora.fullname" . }}-allow-dns
  labels:
    {{- include "nexora.labels" (dict "root" . "component" "nexora") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nexora.fullname" . }}-web
  labels:
    {{- include "nexora.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nexora.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "nexora.selectorLabels" (dict "root" . "component" "control-plane") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 8000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nexora.fullname" . }}-control-plane
  labels:
    {{- include "nexora.labels" (dict "root" . "component" "control-plane") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nexora.selectorLabels" (dict "root" . "component" "control-plane") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "nexora.selectorLabels" (dict "root" . "component" "web") | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 8000 }
  egress:
    - ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 80 }
        - { protocol: TCP, port: 443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nexora.fullname" . }}-migrate
  labels:
    {{- include "nexora.labels" (dict "root" . "component" "migrate") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nexora.selectorLabels" (dict "root" . "component" "migrate") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - ports:
        - { protocol: TCP, port: 5432 }
{{- end }}
