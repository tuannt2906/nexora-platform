apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nexora.fullname" . }}-config
  labels:
    {{- include "nexora.labels" (dict "root" . "component" "nexora") | nindent 4 }}
data:
  NEXORA_ENVIRONMENT: {{ .Values.config.environment | quote }}
  NEXORA_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  NEXORA_LOG_JSON: {{ .Values.config.logJson | quote }}
  NEXORA_CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
