# Production overlay.
#
# RELEASE PLACEHOLDERS -- the ONLY place in the repository where they are allowed:
#   REPLACE_WITH_OWNER        -> lower-case GitHub owner of the registry path
#   REPLACE_WITH_RELEASE_SHA  -> the immutable, CI-built image tag (full git SHA)
# The release workflow substitutes both, then runs `python tools/checks/deploy.py
# --require-substituted <this dir>` which FAILS if any placeholder remains. Applying an
# unsubstituted overlay is therefore blocked by the pipeline (and by an image pull failure).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: nexora-control-plane
    newName: ghcr.io/REPLACE_WITH_OWNER/nexora-platform/control-plane
    newTag: REPLACE_WITH_RELEASE_SHA
  - name: nexora-web
    newName: ghcr.io/REPLACE_WITH_OWNER/nexora-platform/web
    newTag: REPLACE_WITH_RELEASE_SHA
patches:
  - target:
      kind: Ingress
      name: nexora
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: nexora.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: nexora.example.com
