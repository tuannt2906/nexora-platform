# Staging overlay. Same release placeholders and substitution rules as production
# (see ../production/kustomization.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: nexora-control-plane
    newName: ghcr.io/REPLACE_WITH_OWNER/nexora-platform/control-plane
    newTag: REPLACE_WITH_RELEASE_SHA
  - name: nexora-web
    newName: ghcr.io/REPLACE_WITH_OWNER/nexora-platform/web
    newTag: REPLACE_WITH_RELEASE_SHA
patches:
  - target:
      kind: ConfigMap
      name: nexora-config
    patch: |-
      - op: replace
        path: /data/NEXORA_ENVIRONMENT
        value: staging
  - target:
      kind: ExternalSecret
      name: nexora-secrets
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: nexora/staging/database-url
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: nexora/staging/api-token
  - target:
      kind: Ingress
      name: nexora
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: nexora-staging.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: nexora-staging.example.com
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
