# Host and TLS are environment specific and patched by the overlays.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexora
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [nexora.example.invalid]
      secretName: nexora-tls
  rules:
    - host: nexora.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
