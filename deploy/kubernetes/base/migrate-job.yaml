# Database migration, run BEFORE the new application version is rolled out.
# Jobs are immutable: the release procedure deletes the previous Job first
# (docs/operations/upgrade-rollback.md). ttlSecondsAfterFinished garbage-collects old runs.
apiVersion: batch/v1
kind: Job
metadata:
  name: nexora-migrate
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: nexora
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: nexora-control-plane:0.0.0-overridden-by-overlay
          command: ["python", "-m", "nexora_control_plane.migrate"]
          envFrom:
            - configMapRef:
                name: nexora-config
            - secretRef:
                name: nexora-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
