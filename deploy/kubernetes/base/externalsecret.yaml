# Materialises the Kubernetes Secret nexora-secrets from an EXTERNAL secret manager via
# External Secrets Operator (https://external-secrets.io). Requires ESO to be installed and a
# (Cluster)SecretStore named in secretStoreRef. The store below is a PLACEHOLDER name: create
# the real store for your provider (Vault, AWS/GCP/Azure secret manager, ...). No secret value
# is, or ever should be, stored in this repository. See docs/operations/secrets.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexora-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: nexora-secret-store
  target:
    name: nexora-secrets
    creationPolicy: Owner
  data:
    - secretKey: NEXORA_DATABASE_URL
      remoteRef:
        key: nexora/production/database-url
    - secretKey: NEXORA_API_TOKEN
      remoteRef:
        key: nexora/production/api-token
