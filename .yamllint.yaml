extends: default

ignore: |
  deploy/helm/**/templates/
  node_modules/

rules:
  document-start: disable
  line-length:
    max: 200
    level: warning
  truthy:
    check-keys: false   # GitHub workflows use the bare key `on:`
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
  braces:
    max-spaces-inside: 1
