name: Bug report
description: Something does not behave as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, tokens or connection strings. Security issues go to private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release tag or git SHA (see GET /api/v1/platform)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [control-plane, web, sdk, modules/adapters, deploy, ci, docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
