name: Setup NEXORA Python environment
description: Python 3.11 plus dev dependencies installed strictly from the hash-pinned lock file.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: requirements/dev.txt
    - name: Install pinned dependencies and workspace packages
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install --require-hashes -r requirements/dev.txt
        python -m pip install --no-deps -e packages/nexora-core -e packages/nexora-modules \
          -e services/control-plane -e sdk/python
